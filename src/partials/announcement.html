<div class="announce" role="region" aria-label="Pirkimo sąlygos">
  <div class="announce__inner container">
    <p class="announce__side announce__side--start"><svg class="i i--sm" aria-hidden="true" focusable="false"><use href="#i-seal-check"></use></svg>100&nbsp;% originalios prekės</p>
    <div class="announce__rotator" data-rotator>
      <p class="announce__msg is-active">Nemokamas pristatymas perkant 2 ar daugiau prekių</p>
      <p class="announce__msg">14 dienų prekių grąžinimas</p>
      <p class="announce__msg">Apmokėjimas Apple Pay, Google Pay ir el. bankininkyste</p>
    </div>
    <p class="announce__side announce__side--end">
      <a class="announce__link" href="tel:{{ phone }}"><svg class="i i--sm" aria-hidden="true" focusable="false"><use href="#i-phone"></use></svg>{{ phone_display }}</a>
      <a class="announce__link" href="#kontaktai">Pagalba</a>
    </p>
  </div>
</div>
