<script>
/* Motion gate: hidden initial states only apply under html.motion-ok. core.js removes it if Motion fails to load;
   the timeout is a failsafe so content never stays hidden when scripts break. */
(function (h) {
  h.classList.remove('no-js'); h.classList.add('js');
  try { if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) h.classList.add('motion-ok'); } catch (e) {}
  setTimeout(function () { if (!(window.BS && window.BS.ready)) h.classList.remove('motion-ok'); }, 4000);
})(document.documentElement);
</script>
